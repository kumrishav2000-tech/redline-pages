
name: REDLINE DAILY NEWS

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch motorcycle news
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import os
          from datetime import datetime, timezone

          feeds = {
              "Indian Motorcycle News":
                  "https://news.google.com/rss/search?q=motorcycle+India+OR+Indian+bike+when%3A7d&hl=en-IN&gl=IN&ceid=IN:en",
              "Launches & Reviews":
                  "https://news.google.com/rss/search?q=motorcycle+launch+OR+bike+review+India+when%3A7d&hl=en-IN&gl=IN&ceid=IN:en",
              "Global Motorcycle News":
                  "https://news.google.com/rss/search?q=global+motorcycle+news+when%3A7d&hl=en-IN&gl=IN&ceid=IN:en",
              "Electric Two-Wheelers":
                  "https://news.google.com/rss/search?q=electric+motorcycle+OR+electric+scooter+India+when%3A7d&hl=en-IN&gl=IN&ceid=IN:en"
          }

          articles = []
          seen = set()

          for category, url in feeds.items():
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(request, timeout=25) as response:
                      root = ET.fromstring(response.read())

                  for item in root.findall(".//item"):
                      title = item.findtext("title", "").strip()
                      link = item.findtext("link", "").strip()
                      source = item.findtext("source", "").strip()
                      date = item.findtext("pubDate", "").strip()

                      if not title or not link or link in seen:
                          continue

                      seen.add(link)

                      articles.append({
                          "category": category,
                          "title": title,
                          "source": source,
                          "date": date,
                          "link": link
                      })

              except Exception as error:
                  print(f"Feed error ({category}): {error}")

          os.makedirs("data", exist_ok=True)

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "total": len(articles),
              "articles": articles
          }

          with open("data/news-feed.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)

          print(f"Fetched {len(articles)} articles.")
          PY

      - name: Save news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-feed.json
          git diff --cached --quiet || git commit -m "Update REDLINE DAILY news"
          git push
